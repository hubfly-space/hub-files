name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x scripts/package-release.sh scripts/install.sh
          ./scripts/package-release.sh "${VERSION}" linux amd64
          ./scripts/package-release.sh "${VERSION}" linux arm64

      - name: Build combined checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat "dist/hubfly-files_${VERSION}_linux_amd64.tar.gz.sha256" \
              "dist/hubfly-files_${VERSION}_linux_arm64.tar.gz.sha256" \
            > "dist/hubfly-files_${VERSION}_checksums.txt"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*checksums.txt
